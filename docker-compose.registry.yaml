services:
  postgresdb:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: expserver
      POSTGRES_PASSWORD: change-this-password
      POSTGRES_DB: expserver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - eXpServer-network-prod

  backend:
    image: shivagsk121/expserver-backend:v2
    restart: always
    depends_on:
      - redis
      - postgresdb
    ports:
      - "6969:6969"
      - "6970:6970"
    networks:
      - eXpServer-network-prod
    volumes:
      - uploads-data:/app/uploads:z
      - migrations-data:/app/migrations
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      HOST_PWD: /app
      POSTGRES_HOST: postgresdb
      POSTGRES_PORT: 5432
      POSTGRES_USER: expserver
      POSTGRES_PASSWORD: change-this-password
      POSTGRES_DB: expserver
      REDIS_HOST: redis
      REDIS_PORT: 6379
    container_name: expserver-backend
    entrypoint: ["/entrypoint.sh", "--debug=false"]
    security_opt:
      - label:disable
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 4G

  frontend:
    image: shivagsk121/expserver-frontend:v4
    container_name: expserver-frontend
    restart: always
    ports:
      - "6971:6971"
    depends_on:
      - backend
    networks:
      - eXpServer-network-prod

  redis:
    image: redis:latest
    restart: always
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - eXpServer-network-prod

networks:
  eXpServer-network-prod:
    driver: bridge
    name: eXpServer-network-prod

volumes:
  redis-data:
  postgres-data:
  migrations-data:
  uploads-data:

